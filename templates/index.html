<!DOCTYPE html>
<html>

<head>
    <title>Achievement Database</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .list {
            margin: 20px auto 50px;
            width: 400px;
        }

        .item {
            display: block;
            padding: 15px;
            margin: 5px;
            background: #eee;
            text-decoration: none;
            color: black;
        }

        .item:hover {
            background: #ddd;
        }

        .forms {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 50px;
        }

        .form-box {
            border: 1px solid #ccc;
            padding: 25px;
            width: 300px;
        }

        input {
            display: block;
            width: 90%;
            padding: 10px;
            margin: 10px auto;
        }

        .submit-button {
            background: #ddd;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>

    <h1>Achievement Database</h1>

    <!-- Main buttons -->

    <button onclick="showUsers()">
        Users
    </button>

    <button onclick="showGames()">
        Games
    </button>


    <!-- Users/Games list -->

    <div id="list" class="list"></div>

    <!-- Achievement search -->

    <div class="achievement-search">
        <h2>Search Achievements</h2>

        <input
            type="text"
            id="achievementSearch"
            placeholder="Search achievements..."
            oninput="searchAchievements()"
        >

        <div id="achievementResults"></div>

    </div>

    <br>

    <!--- Leader Board --->
    <div id="leaderBoard">
        <h1 style="color: gold;"><b>Leaderboard Top 5</b></h1>
    </div>

    <!-- Add forms -->

    <div class="forms">

        <!-- Add User -->

        <div class="form-box">

            <h2>Add User</h2>

            <form action="/users/add" method="POST">

                <input
                    type="text"
                    name="Username"
                    placeholder="Username"
                    required
                >

                <input
                    type="email"
                    name="Email"
                    placeholder="Email"
                    required
                >

                <button
                    type="submit"
                    class="submit-button"
                >
                    Add User
                </button>

            </form>

        </div>


        <!-- Add Game -->

        <div class="form-box">

            <h2>Add Game</h2>

            <form action="/games/add" method="POST">

                <input
                    type="text"
                    name="GameName"
                    placeholder="Game name"
                    required
                >

                <input
                    type="text"
                    name="Genre"
                    placeholder="Genre"
                    required
                >

                <input
                    type="date"
                    name="ReleaseDate"
                    required
                >

                <button
                    type="submit"
                    class="submit-button"
                >
                    Add Game
                </button>

            </form>

        </div>

    </div>


    <script>

        function searchAchievements() {
            const search = document.getElementById("achievementSearch").value;
            const results = document.getElementById("achievementResults");

            if(search.trim() === "") {
                results.innerHTML = "";
                return;
            }

            fetch("achievements/search?q=" + encodeURIComponent(search))
                .then(response => response.json())
                .then(achievements => {

                    results.innerHTML = "";

                    if(achievements.length === 0) {
                        results.innerHTML = "<p>No achievements found.</p>";
                        return;
                    }
                    
                     achievements.forEach(achievement => {

                    results.innerHTML += `
                        <div class="achievement">
                            <h3>${achievement.AchievementName}</h3>

                            <p>
                                ${achievement.Description}
                            </p>

                            <p>
                                Game: ${achievement.GameName}
                            </p>

                            <p>
                                Points: ${achievement.Points}
                            </p>
                        </div>
                    `;

                });

            });
        }

        function showUsers() {

            fetch("/users")
                .then(response => response.json())
                .then(users => {

                    let list = document.getElementById("list");

                    list.innerHTML = "<h2>Users</h2>";

                    users.forEach(user => {

                        list.innerHTML += `
                            <a class="item"
                               href="/users/${user.UserID}">
                                ${user.Username}
                            </a>
                        `;

                    });
                });
        }


        function showGames() {

            fetch("/games")
                .then(response => response.json())
                .then(games => {

                    let list = document.getElementById("list");

                    list.innerHTML = "<h2>Games</h2>";

                    games.forEach(game => {

                        list.innerHTML += `
                            <a class="item"
                               href="/games/${game.GameID}">
                                ${game.GameName}
                            </a>
                        `;

                    });
                });
        }

        function LeaderBoard() {
            fetch(`/leaderboard`)
            .then(response=>response.json())
            .then(result => {
                list = document.getElementById("leaderBoard");
                list.innerHTML += `
                <ol style="color: gold;"><h2>${result[0].Username} ${result[0].TotalPoints}</h2></li>
                `;
                    
                for(let i = 1; i < 5; i++) {
                    list.innerHTML += `
                        <ol>${result[i].Username} ${result[i].TotalPoints}</li>
                    
                    `;
                }
            })
        }
        LeaderBoard();

    </script>

</body>

</html>
